name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  metrics:
    name: metrics + report (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 只装 numpy + pytest：35 条测试与离线报表都不需要 torch。
      # 这本身就是个卖点——钉住面试数字的那套测试 10 秒内跑完。
      - name: Install (numpy only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest

      - name: Syntax check
        run: python -m compileall -q patchcore_demo.py classify.py analyze.py pyqt_demo.py make_synthetic.py tools tests

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Offline report smoke test
        # 读仓库里已提交的历史 scores，不需要数据集/权重/GPU；
        # 钉住的是「早期快照」口径（macro 0.9805 / pooled 0.8812），
        # 当前主表口径由下面 README numbers 那一步负责。
        run: |
          python classify.py report --scores experiment_data/00_baselines/results_best/scores --fpr 0.005 --ng-ratio 1.2 | tee report.txt
          grep -q '0.9805' report.txt
          grep -q '0.8812' report.txt
          echo 'legacy snapshot numbers match (not the P99.5 main table)'

      - name: Results index is up to date
        # 索引是给人的视图，磁盘上的 results.csv 才是事实；两者漂了就让 CI 红
        run: python tools/index_results.py --check

      - name: Pair baseline json is up to date
        # 主表数字来自逐类运行产物（未覆盖类 10_pair / 覆盖类见 profile evidence）；
        # 任何一侧改动而另一侧没重建，这一步就红。
        run: python tools/build_pair_baseline.py --check

      - name: README numbers match the 90-run baseline
        # 第二道数字闸：README 主表 / docs/pair-baseline.json / 10_pair 的 90 个 run
        # 三者必须一致，避免「文档写 A、仓库算出来 B」
        run: python tools/check_readme_numbers.py

      - name: Thresholds table is up to date
        # docs/thresholds.json 是逐类阈值的唯一来源；改了 run 没改表就让 CI 红
        run: python tools/export_thresholds.py --check

  docs:
    name: docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check relative markdown links
        run: python tools/check_links.py --root .
